version: "3.8"

services:

  postgres:
    image: postgres:16-alpine
    container_name: nacho-postgres
    environment:
      - POSTGRES_USER=nacho
      - POSTGRES_PASSWORD=nacho_password
      - POSTGRES_DB=nacho_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - nacho-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nacho -d nacho_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacho-server:
    build:
      context: ./nacho-server
      dockerfile: Dockerfile
    container_name: nacho-server
    ports:
      - "8123:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://nacho:nacho_password@postgres:5432/nacho_db?schema=public
    volumes:
      - nacho-data:/data
    restart: unless-stopped
    networks:
      - nacho-network
    depends_on:
      postgres:
        condition: service_healthy

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - nacho-network


networks:
  nacho-network:
    driver: bridge

volumes:
  prowlarr-config:
  nacho-data:
  postgres-data: